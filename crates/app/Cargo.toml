[package]
name = "pinwheel"
description = "Volume with Win + wheel and one shortcut per audio output"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ab_glyph = "0.2.32"
# DirectX 12 only: wgpu would otherwise try Vulkan and OpenGL first at each
# opening of the settings window. OpenGL alone is not an option, as Windows
# can lack OpenGL 3.3 (remote sessions, basic display driver).
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "persistence",
    "system_fonts",
    "wgpu_no_default_features",
] }
log = "0.4.35"
pinwheel-core = { path = "../core" }
tiny-skia = "0.12.0"

# Only the app's Windows code uses them, and the WinRT parts do not build elsewhere.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }
windows-core = "0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "UI_ViewManagement",
]

[build-dependencies]
embed-resource = "3.0.12"
