[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "tools/make-icon"]
# The app only builds for Windows; plain `cargo test` on any OS covers the core.
default-members = ["crates/core"]

[workspace.package]
edition = "2024"
version = "0.3.0"
publish = false
license = "MIT"
repository = "https://github.com/KewinDousse/pinwheel-audio"

[profile.release]
lto = true
codegen-units = 1
strip = true
