name: Windows probe

on:
  push:
    branches: [fix/retours-windows]

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pinwheel --release
      - run: pwsh -File .github/probe/probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe-out
